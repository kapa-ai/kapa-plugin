name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  claude-plugin:
    name: Claude plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Validates .claude-plugin/marketplace.json, .claude-plugin/plugin.json
      # and the skills. --strict also fails on warnings.
      - name: Validate
        run: npx -y @anthropic-ai/claude-code@latest plugin validate --strict .
