description = "Turn coverage gaps and feedback into documentation fixes, and track them in Kapa"
prompt = "Close my Kapa project's coverage gaps with documentation, using the kapa MCP server. Load the kapa-docs-from-gaps skill and follow it rather than working the calls out yourself. Start by calling list_projects to confirm I am signed in; if it fails with an authentication error, tell me to run /mcp and sign in, then wait for me before retrying. Ask which project if there is more than one. First check for fixes already in progress, then find new gaps and untriaged feedback, show me what you found ranked by how many people it affects, and agree with me which to work on before drafting anything. Ask where the docs live before writing. Confirm with me before refresh_source."
